# Sized for the shared production server (APK builds from the admin page): one JVM, ~3 GB max.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# compile Kotlin inside the Gradle JVM instead of a second daemon (saves 1–2 GB)
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
