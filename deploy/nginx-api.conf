# @API_DOMAIN@ — reverse proxy to the nexTap API (rendered by deploy/deploy.sh)
# The API sets its own security headers (HSTS, nosniff, X-Frame-Options), CORS and rate limits.
upstream nextap_api { server 127.0.0.1:@PORT@; keepalive 32; }

server {
@LISTEN@
    server_name @API_DOMAIN@;

    # logos / photos are capped by the API (MEDIA_MAX_UPLOAD_BYTES); APK uploads need more room
    client_max_body_size 200m;
    gzip on;
    gzip_types text/plain application/json;
    gzip_min_length 1024;

    location / {
        proxy_pass http://nextap_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;   # live event stream (text/event-stream) stays open
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
    # public uploads (logos, photos)
    location /media/ {
        proxy_pass http://nextap_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }
}
@REDIRECT@
