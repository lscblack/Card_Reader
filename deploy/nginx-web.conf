# @WEB_DOMAIN@ — nexTap web dashboard (web/dist, static SPA) — rendered by deploy/deploy.sh
# The SPA calls the API cross-origin at https://@API_DOMAIN@ (VITE_API_BASE_URL, allowed by CORS_ORIGINS).
# @SCRIPT_HASHES@ are the sha256 hashes of the inline scripts in dist/index.html, computed at deploy time.
server {
@LISTEN@
    server_name @WEB_DOMAIN@;
    root @APP_DIR@/web/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # security headers — repeated in every location because add_header there drops the server-level ones
    set $csp "default-src 'self'; script-src 'self' @SCRIPT_HASHES@; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://@API_DOMAIN@; frame-src 'self' https://www.google.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests";
    add_header Content-Security-Policy $csp always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # hashed build assets: cache forever
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # SPA routes (/dashboard/…, /b/…, /p/…, /reset-password …) → index.html, never cached
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
@REDIRECT@
